# Builds the MaheHub panel as static files (the "out" folder) so they can be uploaded to Hostinger.
# Place this file in the GitHub repo at:  .github/workflows/build-static.yml
# Run it from GitHub: Actions tab -> "Build static site for Hostinger" -> Run workflow.
name: Build static site for Hostinger
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ssaqdsqopxclkplstpzj.supabase.co
      - name: Check the output
        run: |
          test -f out/index.html
          test -f out/c/index.html
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: mahehub-static-site
          path: out/
          retention-days: 7
